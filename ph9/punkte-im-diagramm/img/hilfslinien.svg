<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" role="img" aria-labelledby="title desc">
  <title id="title">Einen Messpunkt mit zwei Hilfslinien eintragen</title>
  <desc id="desc">Im Strecke-Zeit-Diagramm führt eine senkrechte gestrichelte Linie von 10 Sekunden nach oben und eine waagerechte gestrichelte Linie von 80 Metern nach rechts. Sie treffen sich beim Punkt 10 Sekunden und 80 Meter.</desc>
  <rect width="760" height="510" fill="#fff"/>
  <g fill="none" stroke="#171717" stroke-linecap="round" stroke-linejoin="round">
    <!-- Subtle bends and varying line widths suggest a fineliner; the plotted values stay exact. -->
    <path d="M102 406 Q190 405 292 406 Q385 407 482 405.5 Q577 406.5 687 406" stroke-width="3.6"/>
    <path d="M102 406 Q101 357 102 308 Q103 219 101.5 130 Q102.5 77 102 25" stroke-width="3.3"/>
    <path d="M687 406 Q680 401 674 399 M687 406 Q680 410 673 413 M102 25 Q98 32 95 38 M102 25 Q107 32 109 38" stroke-width="3.4"/>
    <path d="M197 405.5 l-.7 8.5 M292 406 l.4 9 M387 407 l-.4 7.5 M482 405.5 l.6 9 M577 406.5 l-.5 8 M672 406 l.5 8.5" stroke-width="2.2"/>
    <path d="M94 344.7 l8 .3 M93.5 283.3 l8.5 -.4 M94 222 l8 .5 M93.5 160.7 l8.5 -.2 M94 99.3 l8 .4 M93.5 38 l8.5 -.2" stroke-width="2.2"/>
    <!-- Two separately drawn, slightly uneven dashed guide lines. -->
    <path d="M102 308 q5 -.5 11 0 M122 308 q5 .5 10 0 M142 308 q6 -.6 11 0 M163 308 q5 .4 10 0 M183 308 q5 -.4 11 0 M204 308 q5 .4 10 0 M224 308 q5 -.4 11 0 M245 308 q5 .4 10 0 M265 308 q5 -.5 11 0 M285 308 h7" stroke-width="2.8"/>
    <path d="M292 406 q-.5 -5 0 -11 M292 385 q.4 -5 0 -10 M292 365 q-.5 -5 0 -11 M292 344 q.4 -5 0 -10 M292 324 q-.5 -5 0 -11 M292 311 v-3" stroke-width="2.9"/>
    <path d="M92 308 q5 -.3 10 0" stroke-width="2.8"/>
    <path d="M299.5 307.5 C300 312 296 316 291.5 315.5 C287 315 284 311 284.5 307.5 C285 303 289 300.5 292.5 300.5 C296.5 301 299 304 299.5 307.5 Z" fill="#fff" stroke-width="3.2"/>
  </g>
  <g fill="#171717" font-family="Chalkboard SE, Bradley Hand, Comic Sans MS, cursive" font-size="19">
    <text x="102" y="439" text-anchor="middle">0</text>
    <text x="197" y="439" text-anchor="middle">5</text>
    <text x="292" y="439" text-anchor="middle" font-weight="700">10</text>
    <text x="387" y="439" text-anchor="middle">15</text>
    <text x="482" y="439" text-anchor="middle">20</text>
    <text x="577" y="439" text-anchor="middle">25</text>
    <text x="672" y="439" text-anchor="middle">30</text>
    <text x="80" y="350" text-anchor="end">50</text>
    <text x="80" y="314" text-anchor="end" font-weight="700">80</text>
    <text x="80" y="289" text-anchor="end">100</text>
    <text x="80" y="228" text-anchor="end">150</text>
    <text x="80" y="166" text-anchor="end">200</text>
    <text x="80" y="105" text-anchor="end">250</text>
    <text x="80" y="44" text-anchor="end">300</text>
    <text x="313" y="293" font-size="21" font-weight="700">(10 s | 80 m)</text>
    <text x="387" y="485" text-anchor="middle" font-size="23" font-weight="700">Zeit t / s</text>
    <text x="29" y="224" text-anchor="middle" font-size="23" font-weight="700" transform="rotate(-90 29 224)">Strecke s / m</text>
  </g>
</svg>
