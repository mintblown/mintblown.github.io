5" width="360" height="68" rx="10" fill="#e6effc" stroke="#b8cde4"/><text x="450.0" y="120" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="600" fill="#19304a">BLE in main.cpp · ArduinoBLE</text><text x="450.0" y="141" text-anchor="middle" font-family="system-ui" font-size="12" fill="#526e8b">RX Write → Parser · TX Notify ← Ereignisse</text><rect x="270" y="190" width="360" height="68" rx="10" fill="#e6effc" stroke="#b8cde4"/><text x="450.0" y="215" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="600" fill="#19304a">Protocol.h · CommandParser</text><text x="450.0" y="236" text-anchor="middle" font-family="system-ui" font-size="12" fill="#526e8b">Format, Grenzen, Auftrags-ID, Duplikate</text><rect x="240" y="285" width="420" height="76" rx="10" fill="#e6effc" stroke="#b8cde4"/><text x="450.0" y="310" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="600" fill="#19304a">main.cpp · Zustandsmaschine</text><text x="450.0" y="331" text-anchor="middle" font-family="system-ui" font-size="12" fill="#526e8b">IDLE / MOVING / SCANNING / STOPPING</text><text x="450.0" y="349" text-anchor="middle" font-family="system-ui" font-size="12" fill="#526e8b">Ein Auftrag aktiv · STOP hat Vorrang</text><rect x="50" y="420" width="340" height="76" rx="10" fill="#e6effc" stroke="#b8cde4"/><text x="220.0" y="445" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="600" fill="#19304a">Motion.h · Kinematik</text><text x="220.0" y="466" text-anchor="middle" font-family="system-ui" font-size="12" fill="#526e8b">mm / Grad → linke und rechte Schrittziele</text><text x="220.0" y="484" text-anchor="middle" font-family="system-ui" font-size="12" fill="#526e8b">Vorzeichen und Kalibrierung</text><rect x="430" y="420" width="320" height="76" rx="10" fill="#e6effc" stroke="#b8cde4"/><text x="590.0" y="445" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="600" fill="#19304a">ScanController<